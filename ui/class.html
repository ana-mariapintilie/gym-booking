<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class bookings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="class">
  <main>
    <p><a href="index.html">← Back to classes</a></p>
    <h1 id="class-title">Class</h1>
    <p id="class-details"></p>
    <p id="class-message" class="message" hidden></p>

    <table id="bookings">
      <thead>
        <tr><th>Member</th><th>Email</th><th>Status</th><th>Booked at</th><th></th></tr>
      </thead>
      <tbody><tr><td colspan="5">Loading…</td></tr></tbody>
    </table>
    <p id="bookings-message" class="message" hidden></p>

    <h2>Book a spot</h2>
    <form id="book">
      <input name="member_name" placeholder="Your name" required>
      <input type="email" name="member_email" placeholder="Your email" required>
      <button type="submit">Book</button>
    </form>
    <p id="book-message" class="message" hidden></p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
