<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gym classes</title>
</head>
<body>
  <h1>Gym classes</h1>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}

  <table border="1" cellpadding="6">
    <tr>
      <th>Class</th><th>Instructor</th><th>Starts</th><th>Minutes</th><th>Capacity</th>
    </tr>
    {% for c in classes %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.instructor }}</td>
        <td>{{ c.starts_at }}</td>
        <td>{{ c.duration_minutes }}</td>
        <td>{{ c.capacity }}</td>
      </tr>
    {% else %}
      <tr><td colspan="5">No classes yet.</td></tr>
    {% endfor %}
  </table>

  <h2>Add a class</h2>
  <form method="post" action="/classes">
    <input name="name" placeholder="Class name" required>
    <input name="instructor" placeholder="Instructor" required>
    <input type="datetime-local" name="starts_at" required>
    <input type="number" name="duration_minutes" value="60" min="1" required>
    <input type="number" name="capacity" value="15" min="1" required>
    <button type="submit">Add class</button>
  </form>
</body>
</html>
